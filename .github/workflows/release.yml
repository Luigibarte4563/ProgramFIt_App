name: Build and Publish Release

# Trigger this workflow only when a version tag is pushed (e.g. v1.0.0).
# Because we trigger on tags, github.ref_name is ALWAYS a valid tag name,
# which prevents the "tag name can't be blank" error.
on:
  push:
    tags:
      - "v*"

# Grant the built-in GITHUB_TOKEN permission to push documentation to the
# main branch and to create/update the GitHub Release. No custom secrets needed.
permissions:
  contents: write

jobs:
  release:
    name: Build APK and Publish Release
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository at the pushed tag, with full history so we
      #    can compute changelogs and resolve the previous release tag.
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Set up the latest stable Flutter SDK (cached for faster runs).
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 3. Install project dependencies.
      - name: Install dependencies
        run: flutter pub get

      # 4. Build the release APK.
      #    Output path (Flutter default):
      #      build/app/outputs/flutter-apk/app-release.apk
      - name: Build release APK
        run: flutter build apk --release

      # 5. Validate that the APK actually exists before uploading, so we fail
      #    fast with a clear message if the output path ever changes.
      - name: Verify APK exists
        run: |
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK not found at $APK_PATH"
            exit 1
          fi
          ls -lh "$APK_PATH"

      # 6. Validate that the tag that triggered this workflow actually exists
      #    and follows Semantic Versioning (vX.Y.Z) before publishing anything.
      - name: Validate Git tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "::error::Git tag '$TAG_NAME' does not exist."
            exit 1
          fi
          VERSION="${TAG_NAME#v}"
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '$TAG_NAME' is not a valid semantic version (expected vX.Y.Z)."
            exit 1
          fi
          echo "Tag '$TAG_NAME' validated -> commit $(git rev-parse --short "$TAG_NAME")"

      # 7. Generate CHANGELOG.md entries and docs/releases/v<version>.md
      #    from the commits in this release.
      - name: Generate release documentation
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # Find the nearest previous version tag to build the commit range.
          PREVIOUS_TAG="$(git tag --sort=-v:refname | grep -v "^${TAG_NAME}$" | head -n 1 || true)"
          bash .github/scripts/generate_release_notes.sh "${TAG_NAME}" "${PREVIOUS_TAG}"

      # 8. Commit and push the generated documentation to the main branch.
      #    Notes:
      #      - Commits pushed via GITHUB_TOKEN do NOT re-trigger this workflow
      #        (avoids infinite loops).
      #      - The docs commit is rebased onto the latest main before pushing.
      - name: Commit and push release documentation
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md docs/
          if git diff --cached --quiet; then
            echo "No documentation changes to commit."
            exit 0
          fi
          git commit -m "docs: add release notes for ${TAG_NAME}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      # 9. Create the GitHub Release (or update it if one already exists for
      #    this tag). softprops/action-gh-release@v2 creates a new release when
      #    none exists for the tag and updates the existing one otherwise.
      #    tag_name is taken from github.ref_name (the pushed tag), so it can
      #    never be blank.
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: build/app/outputs/flutter-apk/app-release.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
